# The ArtCraft plugin packages. `packages` lists every plugin so pnpm links
# them together; the peers they import from the harness installation come from
# `dependencies` below, resolved into this workspace's node_modules.
packages:
  - 'plugin-*'

# The plugins import `@deepseek-ai/cordis` and `@deepseek-ai/dsh-tools` from the
# running harness. Those are `link:` paths into a deepseek-harness checkout,
# because the published npm copies are older than the harness this targets;
# `scripts/install-links.mjs` rewrites them to match your checkout.
dependencies:
  '@deepseek-ai/cordis': link:../../../../deepseek-harness/vendor/cordis
  '@deepseek-ai/dsh-tools': link:../../../../deepseek-harness/packages/core/tools

nodeLinker: hoisted
autoInstallPeers: false
