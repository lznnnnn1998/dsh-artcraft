# The ArtCraft plugin packages. `packages` lists every plugin so pnpm links
# them together.
packages:
  - 'plugin-*'

# The plugins import `@deepseek-ai/cordis` and `@deepseek-ai/dsh-tools` from the
# running harness, and must get the *same* instance the harness runs. Those are
# resolved from a deepseek-harness checkout, because the published npm copies are
# older than the harness this targets.
#
# `node scripts/install-links.mjs` finds that checkout, creates the links in
# every plugin's node_modules, and only then writes the matching `dependencies:`
# block here. It is deliberately absent from this file: a hard-coded `link:`
# path that does not exist on your machine makes `pnpm install` fail outright
# with ERR_PNPM_LINKED_PKG_DIR_NOT_FOUND, before anything could correct it.
nodeLinker: hoisted
autoInstallPeers: false
