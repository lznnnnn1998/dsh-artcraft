<!doctype html><html><head><meta charset="utf-8"><style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e6e9ef; --dim:#8b94a7; --accent:#4f8cff; --ok:#38c172; --err:#e5534b; }
  * { box-sizing:border-box; }
  body { margin:0; padding:26px 30px; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif; }
  h1 { font-size:14px; font-weight:600; color:var(--dim); margin:0 0 16px; }
  .label { color:var(--dim); font-size:11px; margin:20px 0 8px; text-transform:uppercase; letter-spacing:.1em; }
  .row { display:flex; gap:12px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:9px; }
  .icon { width:24px; height:24px; flex:0 0 24px; border-radius:7px; display:grid; place-items:center; background:#1e2430; color:var(--accent); font-size:12px; }
  .icon.ok { color:var(--ok); } .icon.err { color:var(--err); }
  .body { min-width:0; flex:1; }
  .title { font-weight:600; margin-bottom:5px; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font:12.5px/1.55 "SF Mono",ui-monospace,Menlo,monospace; color:#cfd6e4; }
  .files { color:var(--dim); font-size:11.5px; margin-top:6px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:999px; font-size:10.5px; margin-left:8px; border:1px solid currentColor; }
  .err { color:var(--err); }
</style></head><body>
<h1>ArtCraft 工具调用卡片 · 预览(数据来自真实 presenter 输出)</h1>
<div class="label">运行中 — 调用卡片</div><div id="calls"></div>
<div class="label">完成 — 结果卡片</div><div id="results"></div>
<script>const CARDS = {
  "runCall": {
    "card": "generic",
    "kind": "execute",
    "title": "GridCraft · 3 commands → figures.xlsx",
    "content": [
      {
        "type": "text",
        "text": "• cell.set {\"cell\":\"A1\",\"input\":\"Quarter\"}"
      },
      {
        "type": "text",
        "text": "• cell.set {\"cell\":\"B1\",\"input\":\"Revenue\"}"
      },
      {
        "type": "text",
        "text": "• insert.chart {\"type\":\"column\"}"
      }
    ],
    "locations": [
      {
        "path": "figures.xlsx"
      }
    ]
  },
  "runResult": {
    "card": "generic",
    "title": "GridCraft · 2 ok · exit 0",
    "content": [
      {
        "type": "text",
        "text": "wrote figures.xlsx (4069 bytes)"
      },
      {
        "type": "text",
        "text": "took 18 ms"
      }
    ]
  },
  "mcpCall": {
    "card": "generic",
    "kind": "execute",
    "title": "WordCraft · render_page",
    "rawInput": {
      "page": 1,
      "scale": 1.5
    }
  },
  "mcpResult": {
    "card": "generic",
    "title": "WordCraft · mcpCall",
    "content": [
      {
        "type": "text",
        "text": "[image] /tmp/artifacts/wordcraft/render_page-1793640856.png"
      },
      {
        "type": "text",
        "text": "Use read_image on that path to look at it."
      },
      {
        "type": "text",
        "text": "{\"height\":1188,\"pages\":1,\"width\":918}"
      }
    ]
  },
  "figCall": {
    "card": "generic",
    "kind": "execute",
    "title": "FigCraft · 1 command → hero.png",
    "content": [
      {
        "type": "text",
        "text": "• frame.create {\"name\":\"Hero\",\"width\":400,\"height\":300}"
      }
    ],
    "locations": [
      {
        "path": "hero.png"
      }
    ]
  },
  "jobResult": {
    "card": "generic",
    "title": "CADCraft · job",
    "content": [
      {
        "type": "text",
        "text": "j1 (exit 0) — 12s"
      },
      {
        "type": "text",
        "text": "  command: run --cmd line={...} --export out.pdf"
      },
      {
        "type": "text",
        "text": "  log: .artcraft/jobs/cadcraft-j1.log"
      }
    ]
  },
  "failResult": {
    "card": "generic",
    "title": "GridCraft · 0 ok, 1 failed · exit 1",
    "content": [
      {
        "type": "text",
        "text": "first failure — insert.chart: no such command"
      },
      {
        "type": "text",
        "text": "took 21 ms"
      }
    ]
  }
};</script>
<script>
function el(h){ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; }
function call(c){
  const lines=(c.content||[]).map(b=>b.text).join('\n');
  const files=(c.locations||[]).map(l=>l.path).join(', ');
  const icon = c.kind==='search' ? '&#9906;' : c.kind==='read' ? '&#9636;' : '&#9654;';
  return el('<div class="row"><div class="icon">'+icon+'</div><div class="body">'
    + '<div class="title">'+c.title+'</div>'
    + (lines?'<pre>'+lines+'</pre>':'')
    + (files?'<div class="files">&#8599; '+files+'</div>':'') + '</div></div>');
}
function result(c){
  const body=(c.content||[]).map(b=>b.text).join('\n');
  const failed=/failed/i.test(c.title||'');
  return el('<div class="row"><div class="icon '+(failed?'err':'ok')+'">'+(failed?'&#10005;':'&#10003;')+'</div><div class="body">'
    + '<div class="title">'+(c.title||'')+(failed?'<span class="badge err">error</span>':'')+'</div>'
    + '<pre>'+body+'</pre></div></div>');
}
document.getElementById('calls').append(call(CARDS.runCall), call(CARDS.mcpCall), call(CARDS.figCall));
document.getElementById('results').append(result(CARDS.runResult), result(CARDS.mcpResult), result(CARDS.jobResult), result(CARDS.failResult));
</script></body></html>
